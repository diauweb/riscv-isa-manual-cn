<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="RISC-V 指令集手册中英双语社区译本，持续同步上游，支持版本切换与逐段对比。" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      id="lxgw-webfont"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.min.css"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.min.css"
      />
    </noscript>
    <title>RISC-V 指令集手册 · 中英双语</title>
    <script data-cfasync="false">
      // Apply the saved theme before first paint to avoid a light/dark flash,
      // and promote the async webfont stylesheet without inline `onload=`.
      try {
        var wf = document.getElementById("lxgw-webfont");
        if (wf) {
          if (wf.sheet) wf.media = "all";
          else wf.addEventListener("load", function () { wf.media = "all"; });
        }
        var s = JSON.parse(localStorage.getItem("riscv-cn:reader-settings:v1") || "{}");
        var dark = s.theme === "dark" || ((!s.theme || s.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute("content", "#141519");
        }
        if (s.fontSize) document.documentElement.dataset.fontSize = s.fontSize;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script data-cfasync="false" type="module" src="/src/main.tsx"></script>
  </body>
</html>
